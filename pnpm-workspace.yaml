shamefullyHoist: true
packages:
  - e2e
  - .
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@vitest/*"
  - "vitest"
  - "tinyexec"
  - "playwright"
  - "playwright-core"
  - "@playwright/test"
# Keep math renderers and the site's KaTeX stylesheet on the same version.
catalog:
  katex: ^0.18.4
overrides:
  katex: "catalog:"
  "@playwright/test": 1.63.0
  playwright: 1.63.0
  playwright-core: 1.63.0
  react: "npm:@preact/compat@18.3.1"
  react-dom: "npm:@preact/compat@18.3.1"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msw: true
  sharp: true
