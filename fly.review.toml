# fly.toml app configuration file generated for playful-web on 2025-09-27T10:47:33-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'playful-web'
primary_region = 'sjc'

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    # The first SSR request loads content and initializes the renderer.
    timeout = '15s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  # SSR content loading exceeds the 256 MB default used by the static server.
  memory = '1gb'
