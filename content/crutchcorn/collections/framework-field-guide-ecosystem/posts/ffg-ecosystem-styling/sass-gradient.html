<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sass generated color gradient demo</title>
		<style>
			:root {
				color-scheme: light dark;
			}

			body {
				background: transparent;
				margin: 0;
				padding: 1rem;
			}

			.gradient {
				height: 100px;
				width: 100%;
				background: linear-gradient(
					to right,
					#be0000,
					#f10000,
					#ff2525,
					#ff5858,
					#ff8b8b,
					#ffbebe,
					#fff1f1,
					white,
					white,
					white
				);
			}
		</style>
	</head>
	<body>
		<div
			class="gradient"
			role="img"
			aria-label="A gradient from dark red through progressively lighter shades of red to white"
		></div>
	</body>
</html>
