<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sass readable text color demo</title>
		<style>
			:root {
				color-scheme: light dark;
			}

			body {
				background: transparent;
				margin: 0;
				padding: 1rem;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			p {
				margin: 0;
				padding: 1rem;
				font-size: 1.5rem;
				background-color: darkred;
				color: white;
			}
		</style>
	</head>
	<body>
		<p>Testing 123</p>
	</body>
</html>
