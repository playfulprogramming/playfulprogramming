name: Deploy Search Index

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

      - name: Deploy Index
        env:
          MODE: production
          TYPESENSE_WRITE_API_KEY: ${{ secrets.TYPESENSE_WRITE_API_KEY }}
          HOOF_AUTH_TOKEN: ${{ secrets.HOOF_AUTH_TOKEN }}
        run: pnpm nx search-index:deploy
