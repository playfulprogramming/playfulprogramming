name: Markdown Lint

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

      - name: Run paraglide:compile
        run: pnpm nx paraglide:compile

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          json: true
          escape_json: false

      - name: Verify changed files
        run: echo "$CHANGED_FILES" | node --experimental-strip-types scripts/lint-markdown-files.ts
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
