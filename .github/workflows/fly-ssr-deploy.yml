name: Deploy SSR App

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      source_ref:
        required: true
        type: string
    secrets:
      FLY_WEB_PR_REVIEW_TOKEN:
        # May instead be provided by the deployment job's GitHub environment.
        required: false

permissions: {}

env:
  # Reuse the public review package so Fly can pull without registry credentials.
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-review

jobs:
  build:
    name: Build SSR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        id: source
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:ssr-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          # Branch code receives no build secrets or deployment credentials.
          build-args: |
            "BUILD_OUTPUT=server"
            "GIT_COMMIT_REF=${{ steps.source.outputs.commit }}"
            "SITE_URL=https://playfulprogramming.com"
            "MODE=preview"

  deploy:
    name: Deploy SSR preview
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      FLY_ORG: ${{ vars.FLY_PREVIEW_ORG }}
      FLY_API_TOKEN: ${{ secrets.FLY_WEB_PR_REVIEW_TOKEN }}
    steps:
      # Only the image comes from the selected branch. Deployment config is trusted.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Configure app
        run: |
          if ! flyctl status --app "$APP_NAME"; then
            : "${FLY_ORG:?Set the FLY_PREVIEW_ORG repository variable to the preview organization slug}"
            flyctl apps create "$APP_NAME" --org "$FLY_ORG" --yes
          fi

      - name: Deploy app
        id: deploy
        run: |
          flyctl deploy --config fly.staging.toml --app "$APP_NAME" \
            --image "$IMAGE_REPOSITORY@$IMAGE_DIGEST" --ha=false --yes

          flyctl status --app "$APP_NAME" --json >status.json
          hostname=$(jq -er .Hostname status.json)
          echo "url=https://$hostname" >> "$GITHUB_OUTPUT"
