<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Buy Now button with rounded corners and a shadow</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: Canvas;
			}

			button {
				max-width: 100%;
			}
		</style>
	</head>
	<body>
		<button
			aria-label="A large button with dark a rounded purple background, white 'buy now' text, and a shadow"
			style="
				height: 9rem;
				font-size: 4rem;
				border: medium none;
				border-radius: 1rem;
				padding: 0rem 4rem;
				background: rgb(98, 0, 238);
				color: rgb(255, 255, 255);
				box-shadow:
					0px 0.75rem 0.25rem -0.5rem rgba(0, 0, 0, 0.2),
					0px 0.5rem 0.5rem 0px rgba(0, 0, 0, 0.14),
					0px 0.25rem 1.25rem 0px rgba(0, 0, 0, 0.12);
			"
		>
			Buy Now
		</button>
	</body>
</html>
