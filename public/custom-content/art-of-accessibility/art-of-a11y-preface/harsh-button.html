<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Buy Now button with a thick border</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: transparent;
			}

			button {
				max-width: 100%;
			}
		</style>
	</head>
	<body>
		<button
			aria-label="A large button with dark blue border, dark green 'buy now' text, and light red text"
			style="
				background: #ffabab;
				border: 2rem solid #082450;
				color: #213224;
				font-size: 4rem;
			"
		>
			Buy Now
		</button>
	</body>
</html>
