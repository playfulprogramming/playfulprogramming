<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Login form with an associated email error</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				background: transparent;
				margin: 0;
				padding: 1rem;
			}

			input {
				max-width: 100%;
			}

			form {
				flex-wrap: wrap;
			}

			.label {
				margin-right: 1rem;
			}

			.errormessage {
				color: red;
			}
		</style>
	</head>
	<body>
		<form onsubmit="event.preventDefault()">
			<label for="email" class="label">Email</label
			><input id="email" aria-invalid="true" aria-errormessage="email-error" />
			<p class="errormessage" id="email-error">Invalid email</p>
			<label for="password" class="label">Password</label
			><input
				id="password"
				type="password"
				aria-invalid="false"
				aria-errormessage="password-error"
			/>
			<p class="errormessage" id="password-error"></p>
			<button type="submit">Login</button>
		</form>
	</body>
</html>
