<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Table form with explicitly associated labels</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			* {
				box-sizing: border-box;
			}

			body {
				background: transparent;
				margin: 0;
				padding: 1rem;
			}

			input {
				max-width: 100%;
			}

			form {
				flex-wrap: wrap;
			}

			table {
				border-collapse: collapse;
			}

			td {
				padding: 0.5rem;
			}

			td:first-child {
				padding-left: 0;
			}

			input {
				width: 100%;
			}
		</style>
	</head>
	<body>
		<table>
			<tbody>
				<tr>
					<td><label for="username-input">Username</label></td>
					<td><input id="username-input" type="text" /></td>
				</tr>
				<tr>
					<td><label for="password-input">Password</label></td>
					<td><input id="password-input" type="password" /></td>
				</tr>
				<tr>
					<td><label for="confirm-password-input">Confirm Password</label></td>
					<td><input id="confirm-password-input" type="password" /></td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
