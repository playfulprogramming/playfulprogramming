<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo list using a button and semantic list elements</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: Canvas;
			}
		</style>
	</head>
	<body>
		<div>
			<button>Add todo item</button>
			<ul class="todos">
				<li>Play games</li>
				<li>Eat ice cream</li>
				<li>Do chores</li>
			</ul>
		</div>
	</body>
</html>
