<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo list using only div elements</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: Canvas;
			}
		</style>
	</head>
	<body>
		<div>
			<div>Add todo item</div>
			<div class="todos">
				<div>Play games</div>
				<div>Eat ice cream</div>
				<div>Do chores</div>
			</div>
		</div>
	</body>
</html>
