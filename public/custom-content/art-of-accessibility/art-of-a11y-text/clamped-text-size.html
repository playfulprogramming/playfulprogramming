<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Viewport text with relative minimum and maximum sizes</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: transparent;
			}

			p {
				margin: 0;
			}
		</style>
	</head>
	<body>
		<p
			style="
				font-size: clamp(0.75rem, 2vw, 2.25rem);
				line-height: clamp(1rem, 2.5vw, 2.5rem);
			"
		>
			Each character on this line takes up 2% of screen width but has a min and
			max <code>rem</code> value
		</p>
	</body>
</html>
