<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Six HTML heading levels</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: Canvas;
			}

			ul {
				margin: 0;
				padding-left: 2rem;
			}
			p {
				margin: 0 0 0.5rem;
				font-weight: bold;
				line-height: 1.25;
			}
			.level-1 {
				font-size: 3rem;
			}
			.level-2 {
				font-size: 2.5rem;
			}
			.level-3 {
				font-size: 2rem;
			}
			.level-4 {
				font-size: 1.75rem;
			}
			.level-5 {
				font-size: 1.5rem;
			}
			.level-6 {
				font-size: 1.25rem;
			}
		</style>
	</head>
	<body>
		<ul>
			<li>
				<p class="level-1"><code>h1</code></p>
			</li>
			<li>
				<p class="level-2"><code>h2</code></p>
			</li>
			<li>
				<p class="level-3"><code>h3</code></p>
			</li>
			<li>
				<p class="level-4"><code>h4</code></p>
			</li>
			<li>
				<p class="level-5"><code>h5</code></p>
			</li>
			<li>
				<p class="level-6"><code>h6</code></p>
			</li>
		</ul>
	</body>
</html>
