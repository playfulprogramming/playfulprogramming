<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Blurred large text</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				line-height: 1.5;
			}

			body {
				margin: 0;
				padding: 1rem;
				color: CanvasText;
				background: Canvas;
			}

			p {
				margin: 0;
			}
		</style>
	</head>
	<body>
		<p style="font-size: 3rem; filter: blur(2px)">This is large text</p>
	</body>
</html>
